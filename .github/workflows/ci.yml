name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test the CLI
        run: ./build/nova_cli

      - name: Run Native C++ Benchmark
        run: ./build/benchmark_engine

      - name: Run Pybind11 Benchmark
        run: |
          export PYTHONPATH="${PWD}/build:${PYTHONPATH}"
          python tests/benchmark_pybind.py